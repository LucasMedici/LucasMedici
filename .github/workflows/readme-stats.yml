name: Update README stats

on:
  schedule:
    - cron: "0 6 * * *" # daily at 03:00 BRT
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/readme-stats.yml]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    env:
      # STATS_TOKEN (PAT with read:user + repo) includes private contributions; falls back to public data only
      TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      STATS_OPTS: username=LucasMedici&show_icons=true&include_all_commits=true&count_private=true&hide_border=true&disable_animations=true&hide=contribs&hide_rank=true
    steps:
      - uses: actions/checkout@v6

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: ${{ env.STATS_OPTS }}&theme=light_github
          path: profile/stats-light.svg
          token: ${{ env.TOKEN }}
          fail_on_error: true

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: ${{ env.STATS_OPTS }}&theme=dark_github
          path: profile/stats-dark.svg
          token: ${{ env.TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README stats" || exit 0
          git push
